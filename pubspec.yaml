name: offmaps
description: Navegación y trazado de rutas 100% offline con BRouter.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  mapsforge_flutter: ^4.1.0
  mapsforge_flutter_core: ^4.1.0
  mapsforge_flutter_mapfile: ^4.1.0
  mapsforge_flutter_renderer: ^4.1.0
  mapsforge_flutter_rendertheme: ^4.1.0
  flutter_compass: ^0.8.1
  geolocator: ^13.0.0
  share_plus: ^11.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  # Fase 1 (importar KML/KMZ), se usan después:
  xml: 7.0.1
  archive: ^4.0.0
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/render_theme/
    - assets/render_theme/patterns/
    - assets/render_theme/symbols/
    - assets/render_theme/symbols/accommodation/
    - assets/render_theme/symbols/amenity/
    - assets/render_theme/symbols/barrier/
    - assets/render_theme/symbols/custom/
    - assets/render_theme/symbols/custom/amenity/
    - assets/render_theme/symbols/custom/money/
    - assets/render_theme/symbols/custom/tourist/
    - assets/render_theme/symbols/education/
    - assets/render_theme/symbols/food/
    - assets/render_theme/symbols/health/
    - assets/render_theme/symbols/money/
    - assets/render_theme/symbols/place_of_worship/
    - assets/render_theme/symbols/poi/
    - assets/render_theme/symbols/shopping/
    - assets/render_theme/symbols/sport/
    - assets/render_theme/symbols/tourist/
    - assets/render_theme/symbols/transport/
    - assets/render_theme/symbols/water/
